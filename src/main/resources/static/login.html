<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05080f">
    <title>Sign in · SNIPR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <div class="texture-grid" aria-hidden="true"></div>
    <div class="bg-mesh" aria-hidden="true">
        <div class="mesh-blob blob-1"></div>
        <div class="mesh-blob blob-2"></div>
        <div class="mesh-blob blob-3"></div>
    </div>

    <header class="header">
        <a href="/" class="logo" style="text-decoration: none;"><span class="logo-mark" aria-hidden="true">⚡</span>
            SNIPR</a>
        <nav class="nav-links" aria-label="Sign up">
            <a href="/register.html" class="nav-link">Need an account?</a>
            <a href="/register.html" class="btn btn-outline" style="padding: 0.55rem 1.2rem;">Register</a>
        </nav>
    </header>

    <div class="auth-container">
        <div class="glass-card auth-card animate-up">
            <h2>Welcome back</h2>
            <p class="auth-intro">Sign in to shorten links, unlock analytics, and manage your workspace.</p>
            <div id="alert" role="status" aria-live="polite"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="you" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required
                        autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary w-full" style="margin-top: 0.5rem;">Sign in</button>
            </form>

            <div class="auth-link">
                New here? <a href="/register.html">Create an account</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('token', result.data.token);
                    localStorage.setItem('username', result.data.username);
                    window.location.href = '/dashboard.html';
                } else {
                    showAlert(result.message, 'error');
                }
            } catch (error) {
                showAlert('Authentication service unavailable.', 'error');
            }
        });

        function showAlert(message, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => alertDiv.innerHTML = '', 4000);
        }
    </script>
</body>

</html>
