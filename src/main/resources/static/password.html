<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05080f">
    <title>Protected link · SNIPR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="page-auth-minimal">
    <div class="texture-grid" aria-hidden="true"></div>
    <div class="bg-mesh" aria-hidden="true">
        <div class="mesh-blob blob-1"></div>
        <div class="mesh-blob blob-2"></div>
        <div class="mesh-blob blob-3"></div>
    </div>

    <header class="header auth-header-mini">
        <a href="/" class="logo" style="text-decoration: none;"><span class="logo-mark" aria-hidden="true">⚡</span>
            SNIPR</a>
    </header>

    <div class="auth-wrapper">
        <div class="glass-card auth-card animate-up card-warning-accent" style="max-width: 420px; width: 100%;">
            <div class="auth-header text-center">
                <div class="lock-icon-wrap">
                    <span aria-hidden="true">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                </div>
                <h2 class="auth-title">Password required</h2>
                <p class="auth-subtitle">This short link is protected. Enter the password to continue to the
                    destination.</p>
            </div>

            <div id="alert" role="status" aria-live="polite"></div>

            <form id="passwordForm">
                <div style="margin-bottom: 1.5rem;">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" required placeholder="Enter link password"
                        autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary w-full">Continue</button>
            </form>

            <div class="auth-link back-link-row">
                <a href="/">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to home
                </a>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const shortCode = urlParams.get('c');

        if (error === 'invalid') {
            showAlert('Incorrect password. Try again.', 'error');
        }

        if (!shortCode) {
            window.location.href = '/';
        }

        document.getElementById('passwordForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            if (!password) {
                showAlert('Password is required.', 'error');
                return;
            }

            window.location.href = `/${shortCode}?password=${encodeURIComponent(password)}`;
        });

        function showAlert(message, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => alertDiv.innerHTML = '', 4000);
        }
    </script>
</body>

</html>
