# Application Configuration
spring.application.name=SNIPR
server.port=8080
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
app.base-url=http://localhost:8080

# Database Configuration (H2)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}  
spring.h2.console.enabled=true

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.snipr=DEBUG
logging.level.org.springframework.security=DEBUG

# CORS Configuration
cors.allowed-origins=http://localhost:8080,http://localhost:3000

# Rate Limiting (requests per minute)
rate.limit.requests=100
rate.limit.duration=60000

# api key (safe browsing api)
google.safebrowsing.api.key=${GOOGLE_SAFE_BROWSING_API_KEY}

server.port=${PORT:8080}