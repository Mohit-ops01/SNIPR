# Application Configuration
spring.application.name=SNIPR
server.port=8080
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
app.base-url=http://localhost:8080

# Database Configuration (H2)
spring.datasource.url=jdbc:postgresql://localhost:5432/snipr_db
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=Mohit@India
spring.h2.console.enabled=true

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=Zx9@kL2!pQ8$rT5yU1vW7xY3zA6bC0dE4fG8hJ2kL9mN6pQ3
jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.snipr=DEBUG
logging.level.org.springframework.security=DEBUG

# CORS Configuration
cors.allowed-origins=http://localhost:8080,http://localhost:3000

# Rate Limiting (requests per minute)
rate.limit.requests=100
rate.limit.duration=60000

# api key (safe browsing api)
google.safebrowsing.api.key=AIzaSyBIDvxz0ERGWnyevIR4fYFehk9tLxK9tLo

server.port=${PORT:8080}